server:
  port: 8085

spring:
  # MySQL连接
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/music_dreamer?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
  # Redis
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:

# ========== MyBatis-Plus 完整配置 ==========
mybatis-plus:
  # mapper xml文件位置
  mapper-locations: classpath:mapper/**/*.xml
  # 实体类别名包
  type-aliases-package: com.musicdreamer.playlist.entity
  configuration:
    # 下划线转驼峰
    map-underscore-to-camel-case: true
    # 打印SQL日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键策略
      id-type: auto


